name: staging-backend

# Deploys Supabase migrations + edge functions to the STAGING project on every
# push to `staging` that touches supabase/. Requires two repo secrets:
#   SUPABASE_ACCESS_TOKEN  — from your Supabase account (Account → Access Tokens)
#   SUPABASE_PROJECT_REF   — the staging project ref
# Edge-function *secrets* (VERTEX_SERVICE_ACCOUNT, OAuth client secrets, CORS
# origins, etc.) are set once via `supabase secrets set` — NOT in this workflow.
on:
  push:
    branches: [staging]
    paths:
      - 'supabase/**'
  # Manual redeploy — e.g. after adding a new function to the deploy list or
  # setting new secrets, without needing a supabase/ code change to trigger.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      # Functions BEFORE migrations. Migration 028 schedules a pg_cron job that
      # calls metrics-snapshot, and its own header says "deploy the function
      # first" — applying the schedule while the function is missing gives a
      # window of failing cron invocations. Nothing here depends on the reverse
      # order: a function calling a not-yet-created table fails the same way it
      # already does before deploy.
      #
      # NB: explicit list — a new function must be added here or it won't deploy.
      # metrics-snapshot and search-console were missing from this list, which is
      # why metrics-snapshot has been "code-complete but undeployed" since 028.
      - run: supabase functions deploy ai-proxy connector-proxy oauth-proxy meta-callbacks send-scheduler inbox-monitor visibility-scanner metrics-snapshot search-console
      - run: supabase db push
