name: staging-backend

# Deploys Supabase migrations + edge functions to the STAGING project on every
# push to `staging` that touches supabase/. Requires two repo secrets:
#   SUPABASE_ACCESS_TOKEN  — from your Supabase account (Account → Access Tokens)
#   SUPABASE_PROJECT_REF   — the staging project ref
# Edge-function *secrets* (VERTEX_SERVICE_ACCOUNT, OAuth client secrets, CORS
# origins, etc.) are set once via `supabase secrets set` — NOT in this workflow.
on:
  push:
    branches: [staging]
    paths:
      - 'supabase/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase db push
      - run: supabase functions deploy ai-proxy connector-proxy oauth-proxy
