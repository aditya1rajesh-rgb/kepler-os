[functions.ai-proxy]
verify_jwt = true

[functions.search-console]
verify_jwt = true

[functions.connector-proxy]
verify_jwt = true

[functions.oauth-proxy]
verify_jwt = true

# Meta calls these callbacks server-to-server with no Supabase token; the
# function authenticates by verifying Meta's signed_request HMAC instead.
[functions.meta-callbacks]
verify_jwt = false


# send-scheduler + inbox-monitor are invoked by pg_cron (pg_net), which cannot
# mint user JWTs. They authenticate via the x-scheduler-secret header checked
# in-function against the SCHEDULER_SECRET edge secret — never browser-callable.
[functions.send-scheduler]
verify_jwt = false

[functions.inbox-monitor]
verify_jwt = false
